  <!--
    Fonts. Loaded from the document head rather than an @import inside CSS so the
    browser can start the request during preload scanning instead of waiting for
    the stylesheet to parse. The two local display faces are preloaded as woff2.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Space Grotesk is the section-heading face - a geometric sans that sits
    next to the CoC display font (still used for the hero headline and the
    largest brand moments) instead of that font carrying every heading on
    the page.

    Caveat is new: a casual marker/handwriting face reserved for small
    annotations pinned next to character art (a caption tag, a scribbled
    aside) - never body copy or headings. It's the one piece borrowed
    directly from the "corkboard" reference site, kept small and occasional
    rather than becoming the page's voice.
  -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lilita+One&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lilita+One&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lilita+One&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap" />
  </noscript>
  <link rel="preload" href="/supercell-magic.woff2" as="font" type="font/woff2" crossorigin />

  <!--
    Critical path only. The hero is now flat black with cut-out characters, so
    there is no large background photograph to preload - the previous LCP
    candidate no longer exists. Character art is small enough to arrive with
    the normal image queue.
  -->
</head>
